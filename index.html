<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Event Check-In Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  body{margin:0;padding:16px;font-family:-apple-system,Arial,sans-serif;background:#111;color:#fff;text-align:center;}
  h1{font-size:18px;margin:0 0 12px;}
  #reader{width:100%;max-width:420px;margin:0 auto;border-radius:12px;overflow:hidden;}
  #result{max-width:420px;margin:16px auto 0;padding:18px;border-radius:12px;font-size:20px;font-weight:700;min-height:24px;}
  .idle{background:#222;color:#999;font-weight:400;font-size:14px;}
  .ok{background:#16a34a;}
  .warn{background:#d97706;}
  .err{background:#dc2626;}
  .subtext{font-size:14px;font-weight:400;margin-top:8px;}
  #enableBox{display:none;margin-top:16px;}
  #enableBox button{padding:12px 22px;font-size:15px;font-weight:600;border-radius:8px;border:none;background:#2563eb;color:#fff;}
  #manualToggle{margin-top:18px;background:none;border:none;color:#6ab7ff;font-size:13px;text-decoration:underline;}
  #manualBox{display:none;max-width:420px;margin:12px auto 0;}
  #manualBox input{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #444;background:#1a1a1a;color:#fff;font-size:14px;}
  #manualBox button{margin-top:8px;padding:10px 18px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-size:14px;font-weight:600;}
  #staffBar{max-width:420px;margin:0 auto 12px;font-size:13px;color:#bbb;}
  #staffBar a{color:#6ab7ff;margin-left:6px;}
  #staffBox{display:none;max-width:420px;margin:0 auto 14px;padding:14px;border-radius:12px;background:#1d2b45;text-align:left;}
  #staffBox p{margin:0 0 8px;font-size:13px;color:#ddd;}
  #staffBox input{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #444;background:#1a1a1a;color:#fff;font-size:14px;}
  #staffBox button{margin-top:8px;padding:10px 18px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-size:14px;font-weight:600;}
</style>
</head>
<body>
  <h1>Event Check-In Scanner</h1>
  <div id="staffBar"></div>
  <div id="staffBox">
    <p>Enter your staff email once. It is saved on this phone and recorded as the <b>Scanning Staff</b> for each scan. (If you are signed in to your Cru Google account, that email is used.)</p>
    <input id="staffInput" type="email" placeholder="yourname@cru.org.sg" autocomplete="email">
    <button onclick="saveStaff()">Save</button>
  </div>
  <div id="reader"></div>
  <div id="result" class="idle">Point the camera at a participant's QR code.</div>
  <div id="enableBox">
    <button onclick="startScanner()">Enable camera</button>
  </div>
  <button id="manualToggle" onclick="toggleManual()">Type Registration ID manually instead</button>
  <div id="manualBox">
    <input id="manualInput" type="text" placeholder="e.g. ASF260001" autocapitalize="characters">
    <button onclick="submitManual()">Check in</button>
  </div>

<script>
  // ---- CONFIG: update this if the Apps Script backend is redeployed ----
  var SCRIPT_EXEC_URL = 'https://script.google.com/a/macros/cru.org.sg/s/AKfycbxlM-5WHxKhYS1YYb5zLXQqVTuPODSGU2aD-0ifl8L3VXWIc9EYvlzmovKEL2POCd-gVA/exec';
  var SUCCESS_ANNOUNCEMENT = 'Registration successful! Please proceed to the next counter, thank you.';
  var WARN_ANNOUNCEMENT = 'You have already checked in earlier. Please proceed to the next counter, thank you.';

  var STAFF_KEY = 'qrScanStaffEmail';

  var busy = false;

  // ---- Scanning Staff email (saved on this device) ----
  function getStaff() {
    try { return localStorage.getItem(STAFF_KEY) || ''; } catch (e) { return ''; }
  }
  function saveStaff() {
    var v = document.getElementById('staffInput').value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { alert('Please enter a valid email.'); return; }
    try { localStorage.setItem(STAFF_KEY, v); } catch (e) {}
    document.getElementById('staffBox').style.display = 'none';
    renderStaffBar();
  }
  function changeStaff() {
    document.getElementById('staffInput').value = getStaff();
    document.getElementById('staffBox').style.display = 'block';
  }
  function renderStaffBar() {
    var s = getStaff();
    var bar = document.getElementById('staffBar');
    if (s) {
      var dash = SCRIPT_EXEC_URL + '?view=dashboard&tab=log&staff=' + encodeURIComponent(s);
      bar.innerHTML = 'Scanning as <b>' + escapeHtml(s) + '</b> <a href="#" onclick="changeStaff();return false;">change</a>' +
        '<a href="' + escapeHtml(dash) + '" target="_top">my scans</a>';
    } else {
      bar.innerHTML = '';
      document.getElementById('staffBox').style.display = 'block';
    }
  }
  var html5Qrcode = null;

  function showResult(cls, text) {
    var el = document.getElementById('result');
    el.className = cls;
    el.innerHTML = text;
  }

  function showSuccess(name) {
    var el = document.getElementById('result');
    el.className = 'ok';
    el.innerHTML =
      (name ? escapeHtml(name) + ' — PRESENT ✓' : 'PRESENT ✓') +
      '<div class="subtext">' + escapeHtml(SUCCESS_ANNOUNCEMENT) + '</div>';
  }

  function showAlreadyChecked(name, time) {
    var el = document.getElementById('result');
    el.className = 'warn';
    el.innerHTML =
      (name ? escapeHtml(name) + ' — already checked in at ' + escapeHtml(time) : 'Already checked in') +
      '<div class="subtext">' + escapeHtml(WARN_ANNOUNCEMENT) + '</div>';
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function stopCameraSafely() {
    try {
      if (html5Qrcode) { html5Qrcode.stop().catch(function () {}); }
    } catch (e) {}
  }

  function goMark(token) {
    if (busy) return;
    busy = true;
    showResult('idle', 'Checking...');
    var returnUrl = window.location.origin + window.location.pathname;
    stopCameraSafely();
    var url = SCRIPT_EXEC_URL + '?action=mark&token=' + encodeURIComponent(String(token).trim()) +
      '&staff=' + encodeURIComponent(getStaff()) + '&return=' + encodeURIComponent(returnUrl);
    window.location.href = url;
  }

  function startScanner() {
    document.getElementById('enableBox').style.display = 'none';
    try {
      html5Qrcode = new Html5Qrcode('reader');
      html5Qrcode.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        function onScanSuccess(decodedText) {
          goMark(decodedText);
        },
        function onScanFailure() { /* ignore per-frame no-match */ }
      ).catch(function (err) {
        showResult('err', 'Camera unavailable — tap below');
        document.getElementById('enableBox').style.display = 'block';
      });
    } catch (err) {
      showResult('err', 'Camera unavailable — tap below');
      document.getElementById('enableBox').style.display = 'block';
    }
  }

  function toggleManual() {
    var box = document.getElementById('manualBox');
    box.style.display = (box.style.display === 'block') ? 'none' : 'block';
  }

  function submitManual() {
    var val = document.getElementById('manualInput').value.trim();
    if (!val) return;
    goMark(val);
  }

  (function init() {
    renderStaffBar();
    var params = new URLSearchParams(window.location.search);
    var r = params.get('r');

    if (r === 'ok') {
      var name = params.get('name') || '';
      showSuccess(name);
    } else if (r === 'warn') {
      var wName = params.get('name') || '';
      var wTime = params.get('time') || '';
      showAlreadyChecked(wName, wTime);
    } else if (r === 'err') {
      var msg = params.get('msg') || 'Not recognized';
      showResult('err', escapeHtml(msg));
    }

    // Clean the URL so a refresh doesn't re-show the old result.
    if (r) {
      history.replaceState(null, '', window.location.pathname);
    }

    // Give the result a moment to be read, then restart the camera for the
    // next scan (requires one tap only the very first time camera access is
    // granted on this device — after that, restarting like this works
    // without a fresh permission prompt).
    setTimeout(function () {
      busy = false;
      startScanner();
    }, r ? 1800 : 0);
  })();
</script>
</body>
</html>
