<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Event Check-In Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<!--
  index.html = the scanner page (v2.14, Oct 2026). v2.14: only @cru.org.sg staff can scan. Upload to GitHub qr-scanner as is.
  NEW in v2.12: beep sounds (BEEP_ON). Tap the blue button once per page open.
  NEW in v2.11: OFFLINE MODE. If the phone loses signal, scans are saved on
  the phone (grey "SAVED OFFLINE" card, red bar at the top) and sent to the
  sheet by themselves when the signal comes back. Needs fast mode
  (FAST_EXEC_URL) and Code.gs v2.11 on the Fast scan deployment.
-->
<style>
  body{margin:0;padding:16px;font-family:-apple-system,Arial,sans-serif;background:#111;color:#fff;text-align:center;}
  h1{font-size:18px;margin:0 0 12px;}
  #reader{width:100%;max-width:420px;margin:0 auto;border-radius:12px;overflow:hidden;}
  #result{max-width:420px;margin:16px auto 0;padding:18px;border-radius:12px;font-size:20px;font-weight:700;min-height:24px;}
  .idle{background:#222;color:#999;font-weight:400;font-size:14px;}
  .ok{background:#16a34a;}
  .warn{background:#d97706;}
  .err{background:#dc2626;}
  .saved{background:#4b5563;}
  .subtext{font-size:14px;font-weight:400;margin-top:8px;}
  #enableBox{display:none;margin-top:16px;}
  #enableBox button{padding:12px 22px;font-size:15px;font-weight:600;border-radius:8px;border:none;background:#2563eb;color:#fff;}
  #manualToggle{margin-top:18px;background:none;border:none;color:#6ab7ff;font-size:13px;text-decoration:underline;}
  #manualBox{display:none;max-width:420px;margin:12px auto 0;}
  #manualBox input{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #444;background:#1a1a1a;color:#fff;font-size:14px;}
  #manualBox button{margin-top:8px;padding:10px 18px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-size:14px;font-weight:600;}
  #beepBtn{display:none;margin:0 auto 10px;padding:10px 18px;background:#2563eb;color:#fff;border:none;border-radius:20px;font-size:14px;font-weight:600;}
  #soundBtn{display:none;margin:0 auto 10px;padding:8px 16px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:18px;font-size:13px;}
  #modeBar{max-width:420px;margin:0 auto 10px;font-size:12px;color:#999;}
  #modeBar.on{color:#4ade80;} #modeBar.off{color:#fbbf24;}
  #staffBar{max-width:420px;margin:0 auto 12px;font-size:13px;color:#bbb;}
  #staffBar a{color:#6ab7ff;margin-left:6px;}
  #staffBox{display:none;max-width:420px;margin:0 auto 14px;padding:14px;border-radius:12px;background:#1d2b45;text-align:left;}
  #staffBox p{margin:0 0 8px;font-size:13px;color:#ddd;}
  #staffBox input{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #444;background:#1a1a1a;color:#fff;font-size:14px;}
  #staffBox button{margin-top:8px;padding:10px 18px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-size:14px;font-weight:600;}
  /* Network status bar (offline mode) */
  #netBar{max-width:420px;margin:0 auto 12px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;display:none;}
  #netBar.online{display:block;background:#14532d;color:#bbf7d0;font-weight:500;font-size:13px;}
  #netBar.offline{display:block;background:#b91c1c;color:#fff;font-size:16px;}
  #netBar.syncing{display:block;background:#a16207;color:#fff;}
  #netBar .small{display:block;font-size:12px;font-weight:400;margin-top:4px;opacity:.9;}
  #netBar button{margin-top:8px;padding:6px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);color:#fff;font-size:13px;font-weight:600;}
</style>
</head>
<body>
  <h1>Event Check-In Scanner</h1>
  <div id="staffBar"></div>
  <div id="modeBar"></div>
  <div id="netBar"></div>
  <div id="staffBox">
    <p><b>Required before scanning:</b> enter your <b>@cru.org.sg</b> staff email once. It is saved on this phone and recorded as the <b>Scanning Staff</b> for each scan.</p>
    <input id="staffInput" type="email" placeholder="yourname@cru.org.sg (Cru staff only)" autocomplete="email">
    <button onclick="saveStaff()">Save</button>
  </div>
  <button id="beepBtn" onclick="unlockBeep()">🔔 Tap once to turn on scan sounds</button>
  <button id="soundBtn" onclick="unlockSound()">🔊 Tap once to turn on voice</button>
  <div id="reader"></div>
  <div id="result" class="idle">Point the camera at a participant's QR code.</div>
  <div id="enableBox">
    <button onclick="startScanner()">Enable camera</button>
  </div>
  <button id="manualToggle" onclick="toggleManual()">Type Registration ID manually instead</button>
  <div id="manualBox">
    <input id="manualInput" type="text" placeholder="e.g. ASF260001" autocapitalize="characters">
    <button onclick="submitManual()">Check in</button>
  </div>

<script>
  // ---- CONFIG: update this if the Apps Script backend is redeployed ----
  // Staff deployment ("Anyone within cru.org.sg"). Used for the classic
  // redirect + "Scan Next" mode, and for the "my scans" dashboard link.
  var SCRIPT_EXEC_URL = 'https://script.google.com/a/macros/cru.org.sg/s/AKfycbxlM-5WHxKhYS1YYb5zLXQqVTuPODSGU2aD-0ifl8L3VXWIc9EYvlzmovKEL2POCd-gVA/exec';

  // FAST MODE (no "Scan Next" tap): paste the /exec URL of a SECOND
  // deployment whose access is "Anyone" (setup guide section 7b).
  // Offline mode also needs this. >>> PASTE YOUR FAST SCAN LINK HERE <<<
  var FAST_EXEC_URL = 'https://script.google.com/a/macros/cru.org.sg/s/AKfycbyBTrtgmFjGDZrpiulLA4SSVh_gJX4MM5qeK7zmu7UXqtjG0Ikx4vK0jPOCnXzBNm1yug/exec';

  // Must match SCAN_KEY in Code.gs (leave '' if Code.gs has none).
  var SCAN_KEY = 'asf26-eba111a8';

  // Voice: false = silent (text + vibration only). Set true to turn voice back on.
  var VOICE_ON = false;

  // Beep sounds: high "beep" = success, two beeps = already checked in,
  // low buzz = error, soft tone = saved offline. false = no sounds.
  var BEEP_ON = true;

  // Only staff emails ending with this domain can scan (must match
  // SCAN_STAFF_DOMAIN in Code.gs). Add exceptions to EXTRA_SCAN_STAFF in BOTH
  // files. Set '' to allow any email.
  var STAFF_DOMAIN = 'cru.org.sg';
  var EXTRA_SCAN_STAFF = [];

  // Offline mode: true = save scans on the phone when there is no signal.
  var OFFLINE_MODE = true;

  var SHOW_RESULT_MS = 1500;     // how long the result shows before the next scan is accepted
  var SAME_CODE_PAUSE_MS = 5000; // ignore the same QR for this long (it is often still in view)
  var SCAN_TIMEOUT_MS = 8000;    // no reply after this long = treat as no signal, save offline
  var HEARTBEAT_MS = 10000;      // how often to check the connection
  var SYNC_BATCH = 10;           // saved scans sent per request
  var SUCCESS_ANNOUNCEMENT = 'Registration successful! Please proceed to the next counter, thank you.';
  var WARN_ANNOUNCEMENT = 'You have already checked in earlier. Please proceed to the next counter, thank you.';

  var STAFF_KEY = 'qrScanStaffEmail';
  var QUEUE_KEY = 'qrOfflineQueue';

  var busy = false;
  var fastOk = false;    // fast mode backend reachable and key correct
  var fastEverOk = false; // fast mode worked at least once on this page
  var fastBadSetup = false; // Google answered, but SCAN_KEY or Code.gs version is wrong
  var online = true;     // our best guess of the connection
  var syncing = false;
  var lastSyncNote = '';
  var memQueue = null;   // used only if this browser blocks storage
  var lastCode = '', lastCodeAt = 0;

  // ---- Scanning Staff email (saved on this device) ----
  // The email is kept in memory too, in case this browser blocks saving
  // (e.g. private / incognito / "secret" mode).
  var memStaff = '';
  function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || '')); }
  function staffOk(v) {
    v = String(v || '').trim().toLowerCase();
    if (!isEmail(v)) return false;
    if (EXTRA_SCAN_STAFF.some(function (e) { return String(e).trim().toLowerCase() === v; })) return true;
    return !STAFF_DOMAIN || v.slice(-(STAFF_DOMAIN.length + 1)) === '@' + STAFF_DOMAIN;
  }
  function getStaff() {
    var v = '';
    try { v = localStorage.getItem(STAFF_KEY) || ''; } catch (e) {}
    return v || memStaff;
  }
  function setStaff(v) {
    v = String(v || '').trim().toLowerCase();
    memStaff = v;
    try { localStorage.setItem(STAFF_KEY, v); } catch (e) {}
  }
  function saveStaff() {
    var v = document.getElementById('staffInput').value.trim().toLowerCase();
    if (!isEmail(v)) { alert('Please enter a valid email.'); return; }
    if (!staffOk(v)) { alert('Only Cru staff can scan. Please use your @' + STAFF_DOMAIN + ' email.'); return; }
    setStaff(v);
    document.getElementById('staffBox').style.display = 'none';
    renderStaffBar();
    if (document.getElementById('result').className === 'err') showResult('idle', 'Thank you. Point the camera at a participant\'s QR code.');
  }
  function changeStaff() {
    document.getElementById('staffInput').value = getStaff();
    document.getElementById('staffBox').style.display = 'block';
  }
  function renderStaffBar() {
    var s = getStaff();
    var bar = document.getElementById('staffBar');
    if (s) {
      var dash = SCRIPT_EXEC_URL + '?view=dashboard&tab=log&staff=' + encodeURIComponent(s);
      bar.innerHTML = 'Scanning as <b>' + escapeHtml(s) + '</b> <a href="#" onclick="changeStaff();return false;">change</a>' +
        '<a href="' + escapeHtml(dash) + '" target="_top">my scans</a>';
    } else {
      bar.innerHTML = '';
      document.getElementById('staffBox').style.display = 'block';
    }
  }
  var html5Qrcode = null;

  function showResult(cls, text) {
    var el = document.getElementById('result');
    el.className = cls;
    el.innerHTML = text;
  }

  function showSuccess(name, regId) {
    showResult('ok',
      (name ? escapeHtml(name) + ' — PRESENT ✓' : 'PRESENT ✓') +
      (regId ? '<div class="subtext">' + escapeHtml(regId) + '</div>' : '') +
      '<div class="subtext">' + escapeHtml(SUCCESS_ANNOUNCEMENT) + '</div>');
  }

  function showAlreadyChecked(name, time) {
    showResult('warn',
      (name ? escapeHtml(name) + ' — already checked in at ' + escapeHtml(time) : 'Already checked in') +
      '<div class="subtext">' + escapeHtml(WARN_ANNOUNCEMENT) + '</div>');
  }

  function showSavedOffline(token, already) {
    showResult('saved',
      (already ? 'ALREADY SAVED on this phone' : 'SAVED OFFLINE') +
      '<div class="subtext">' + escapeHtml(token) + '</div>' +
      '<div class="subtext">No signal. This scan will be checked and sent when the phone is back online. Keep this page open.</div>');
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // ---- Voice (off by default) ----
  function pickFemaleVoice() {
    var vs = (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];
    var names = ['female','samantha','victoria','karen','moira','tessa','fiona','kate','serena','susan','allison','ava','zoe','nicky','zira','hazel','eva','joanna','salli','kimberly'];
    for (var i = 0; i < vs.length; i++) {
      var n = (vs[i].name || '').toLowerCase();
      for (var j = 0; j < names.length; j++) { if (n.indexOf(names[j]) > -1) return vs[i]; }
    }
    for (var k = 0; k < vs.length; k++) { if (/^en/i.test(vs[k].lang)) return vs[k]; }
    return null;
  }
  function unlockSound() {
    try {
      var u = new SpeechSynthesisUtterance('Voice on');
      var v = pickFemaleVoice(); if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    } catch (e) {}
    document.getElementById('soundBtn').style.display = 'none';
  }
  function speak(text) {
    if (!VOICE_ON) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var v = pickFemaleVoice(); if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  try { window.speechSynthesis.getVoices(); } catch (e) {}

  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  // ---- Beep sounds (Web Audio, no sound files needed) ----
  // Phones only allow sound after one real tap on the page, so a blue
  // "Tap once to turn on scan sounds" button shows until sound is unlocked.
  // Any tap on the page also unlocks it.
  var audioCtx = null, beepReady = false;
  function unlockBeep() {
    if (!BEEP_ON) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      // play a silent blip so iOS fully unlocks
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      g.gain.value = 0.0001; o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.02);
      beepReady = true;
    } catch (e) {}
    var b = document.getElementById('beepBtn');
    if (b && beepReady) b.style.display = 'none';
  }
  function tone(freq, start, dur, type, vol) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    var t0 = audioCtx.currentTime + start;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.35, t0 + 0.01);
    g.gain.setValueAtTime(vol || 0.35, t0 + dur - 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function beep(kind) {
    if (!BEEP_ON || !audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (kind === 'ok') { tone(1320, 0, 0.15, 'square', 0.2); }
      else if (kind === 'warn') { tone(880, 0, 0.12, 'square', 0.2); tone(880, 0.18, 0.12, 'square', 0.2); }
      else if (kind === 'err') { tone(200, 0, 0.45, 'sawtooth', 0.3); }
      else if (kind === 'saved') { tone(660, 0, 0.2, 'sine', 0.35); }
      else if (kind === 'dup') { tone(660, 0, 0.1, 'sine', 0.35); tone(660, 0.15, 0.1, 'sine', 0.35); }
    } catch (e) {}
  }
  // Sound + vibration together
  function feedback(kind) {
    beep(kind);
    buzz({ ok: 120, warn: [80, 60, 80], err: [200, 80, 200], saved: [40, 40, 40, 40, 40], dup: [60, 60, 60] }[kind] || 100);
  }
  ['touchstart', 'click'].forEach(function (ev) { document.addEventListener(ev, unlockBeep, { passive: true }); });

  function stopCameraSafely() {
    try { if (html5Qrcode) { html5Qrcode.stop().catch(function () {}); } } catch (e) {}
  }

  // ---- Offline queue (saved in this browser) ----
  function loadQueue() {
    if (memQueue) return memQueue;
    try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]') || []; } catch (e) { return memQueue || []; }
  }
  function saveQueue(q) {
    try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); memQueue = null; }
    catch (e) { memQueue = q; } // storage blocked: keep in memory (lost if the page closes)
    renderNetBar();
  }
  function queueScan(token) {
    var q = loadQueue();
    var dup = q.some(function (it) { return it.token.toUpperCase() === token.toUpperCase(); });
    if (!dup) {
      q.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), token: token, staff: getStaff(), at: Date.now() });
      saveQueue(q);
    }
    showSavedOffline(token, dup);
    feedback(dup ? 'dup' : 'saved');
  }

  // ---- Network status bar ----
  function renderNetBar() {
    var bar = document.getElementById('netBar');
    if (!OFFLINE_MODE || !FAST_EXEC_URL) { bar.className = ''; bar.innerHTML = ''; return; }
    var n = loadQueue().length;
    var warnMem = memQueue ? '<span class="small">Warning: this browser blocks saving. Do not close this page.</span>' : '';
    if (!online) {
      bar.className = 'offline';
      bar.innerHTML = '⚠ OFFLINE: keep scanning, scans are saved on this phone' +
        '<span class="small">' + n + ' scan' + (n === 1 ? '' : 's') + ' waiting to send. Do not close this page.</span>' + warnMem;
    } else if (n > 0 || syncing) {
      bar.className = 'syncing';
      bar.innerHTML = (syncing ? 'Back online: sending ' : 'Online: ') + n + ' saved scan' + (n === 1 ? '' : 's') + (syncing ? '…' : ' waiting') +
        '<span class="small">Keep this page open until this reaches 0.</span>' +
        (!syncing ? '<button onclick="syncQueue()">Send now</button>' : '') + warnMem;
    } else {
      bar.className = 'online';
      bar.innerHTML = '● Online: scans are sent straight away' + (lastSyncNote ? '<span class="small">' + lastSyncNote + '</span>' : '');
    }
  }

  function setOnline(v) {
    var was = online;
    online = v;
    renderNetBar();
    if (v && !was) syncQueue();
  }

  // Ping the Fast scan deployment. Tells us if the internet really works
  // (a phone can show Wi-Fi bars with no internet behind them).
  function ping(timeoutMs) {
    return new Promise(function (resolve) {
      if (!FAST_EXEC_URL) return resolve({ reach: false });
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; resolve({ reach: false }); } }, timeoutMs || 6000);
      fetch(fastUrl() + '?action=ping&key=' + encodeURIComponent(SCAN_KEY) + '&t=' + Date.now(), { cache: 'no-store', redirect: 'follow' })
        .then(function (r) { return r.json(); })
        .then(function (j) { if (!done) { done = true; clearTimeout(t); resolve({ reach: true, json: j }); } })
        .catch(function () { if (!done) { done = true; clearTimeout(t); resolve({ reach: false }); } });
    });
  }

  function heartbeat() {
    if (!FAST_EXEC_URL) return;
    ping(6000).then(function (r) {
      if (r.reach && r.json && r.json.ok && r.json.keyOk) {
        if (!fastOk) { fastOk = true; fastBadSetup = false; setModeBar('on'); }
        fastEverOk = true;
        setOnline(true);
      } else if (!r.reach && OFFLINE_MODE) {
        setOnline(false);
      }
    });
  }

  // Send saved scans in small batches. Each one is checked against the
  // roster as normal; results go to the Scan Log ("QR scan (offline sync)").
  function syncQueue() {
    if (syncing || !online || !fastOk) return;
    var q = loadQueue();
    if (!q.length) { renderNetBar(); return; }
    syncing = true; renderNetBar();
    var batch = q.slice(0, SYNC_BATCH);
    var url = fastUrl() + '?action=markbatch&key=' + encodeURIComponent(SCAN_KEY) +
      '&items=' + encodeURIComponent(JSON.stringify(batch)) + '&t=' + Date.now();
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; syncing = false; setOnline(false); } }, 30000);
    fetch(url, { cache: 'no-store', redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (done) return; done = true; clearTimeout(timer);
        if (!res || !res.ok || !res.results) { syncing = false; lastSyncNote = 'Sync problem: ' + ((res && res.message) || 'unexpected reply'); renderNetBar(); return; }
        var sentIds = {}, problems = 0, okCount = 0;
        res.results.forEach(function (r) {
          if (r.retry) return; // busy / error: keep it and try again later
          sentIds[r.id] = 1;
          if (r.success && (!r.alreadyChecked || r.sameStaff)) okCount++; else problems++;
        });
        var left = loadQueue().filter(function (it) { return !sentIds[it.id]; });
        saveQueue(left);
        syncTotals.ok += okCount; syncTotals.problems += problems;
        lastSyncNote = 'Last sync: ' + syncTotals.ok + ' checked in' +
          (syncTotals.problems ? ', ' + syncTotals.problems + ' with a problem (see Scan Log on the dashboard)' : '');
        syncing = false;
        renderNetBar();
        if (left.length) setTimeout(syncQueue, 300); // more to send
        else if (document.getElementById('result').className === 'saved') {
          showResult('idle', 'Back online. All saved scans have been sent. Ready for the next scan.');
        }
      })
      .catch(function () {
        if (done) return; done = true; clearTimeout(timer);
        syncing = false; setOnline(false);
      });
  }
  var syncTotals = { ok: 0, problems: 0 };

  // ---- Scanning ----
  function goMark(token) {
    token = String(token || '').trim();
    if (!token || busy) return;
    var now = Date.now();
    if (token === lastCode && now - lastCodeAt < SAME_CODE_PAUSE_MS) return; // same QR still in front of camera
    // No scanning until the staff email is set, so every check-in records
    // who scanned it (never "unknown").
    if (!staffOk(getStaff())) {
      document.getElementById('staffBox').style.display = 'block';
      showResult('err', 'Please enter your @' + (STAFF_DOMAIN || 'staff') + ' email at the top first, then scan again.');
      feedback('err');
      try { document.getElementById('staffInput').focus(); } catch (e) {}
      return;
    }
    lastCode = token; lastCodeAt = now;
    busy = true;

    var canOffline = OFFLINE_MODE && FAST_EXEC_URL;
    if (canOffline && (!online || (navigator.onLine === false))) {
      if (navigator.onLine === false) setOnline(false);
      queueScan(token);
      setTimeout(function () { busy = false; }, SHOW_RESULT_MS);
      return;
    }
    // Classic redirect only when fast mode is not set up at all, or Google
    // answered but the setup is wrong. With offline mode on, a scan is never
    // sent by page redirect when Google can't be reached (that would lose the
    // scanner page); it tries in the background and saves it if no reply.
    if (!FAST_EXEC_URL || fastBadSetup || (!OFFLINE_MODE && !fastOk)) { showResult('idle', 'Checking...'); redirectMark(token); return; }
    showResult('idle', 'Checking...');
    fastMark(token);
  }

  // Fast mode: ask the backend in the background. The camera keeps running.
  // Workspace links like .../a/macros/cru.org.sg/s/ID/exec force a Cru
  // sign-in; the plain .../macros/s/ID/exec form of the SAME deployment does not.
  function fastUrl() {
    return String(FAST_EXEC_URL).trim().replace(/\/a\/macros\/[^\/]+\/s\//, '/macros/s/');
  }

  function setModeBar(state, why) {
    var bar = document.getElementById('modeBar');
    if (state === 'classic') { bar.className = 'off'; bar.textContent = 'Mode: classic (tap "Scan Next" after each scan). To scan without Scan Next, fill in FAST_EXEC_URL (setup guide 7b).'; }
    else if (state === 'checking') { bar.className = ''; bar.textContent = 'Checking fast mode...'; }
    else if (state === 'on') { bar.className = 'on'; bar.textContent = '⚡ Fast mode ON (no "Scan Next" needed)'; }
    else { bar.className = 'off'; bar.textContent = 'Fast mode OFF: ' + why; }
  }

  // On page load, check that fast mode really works, and say so on screen.
  function checkFastMode(done) {
    if (!FAST_EXEC_URL) { setModeBar('classic'); return done(); }
    setModeBar('checking');
    ping(10000).then(function (r) {
      if (!r.reach) {
        fastOk = false;
        if (OFFLINE_MODE) {
          setModeBar('off', 'cannot reach Google right now. Scans will be saved on this phone and sent when it can. (If you DO have signal, check FAST_EXEC_URL and that the Fast scan deployment access is "Anyone".)');
          setOnline(false);
        } else {
          setModeBar('off', 'cannot reach the Fast scan deployment. Check its access is "Anyone" (not "Anyone within cru.org.sg" or "Anyone with Google account"), and that FAST_EXEC_URL is its /exec link. Using classic mode for now.');
        }
      } else if (!r.json || !r.json.ok) {
        fastOk = false; fastBadSetup = true; setModeBar('off', 'unexpected reply. Is Code.gs updated and the Fast scan deployment on a New version? Using classic mode for now.');
      } else if (!r.json.keyOk) {
        fastOk = false; fastBadSetup = true; setModeBar('off', 'SCAN_KEY here does not match SCAN_KEY in Code.gs. Using classic mode for now.');
      } else {
        fastOk = true; fastEverOk = true; setModeBar('on'); setOnline(true);
      }
      done();
    });
  }

  function fastMark(token) {
    var url = fastUrl() + '?action=markjson&token=' + encodeURIComponent(token) +
      '&staff=' + encodeURIComponent(getStaff()) + '&key=' + encodeURIComponent(SCAN_KEY) + '&t=' + Date.now();
    var finished = false;
    var timer = setTimeout(function () { if (!finished) { finished = true; noReply('timeout'); } }, SCAN_TIMEOUT_MS);
    fetch(url, { method: 'GET', cache: 'no-store', redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (finished) return; finished = true; clearTimeout(timer);
        setOnline(true);
        showResultObj(res);
        setTimeout(function () { busy = false; }, SHOW_RESULT_MS);
      })
      .catch(function (err) {
        if (finished) return; finished = true; clearTimeout(timer);
        noReply(err);
      });

    // No reply. With offline mode on, save the scan on the phone (a page
    // redirect with no signal would lose the scanner). Without it, fall back
    // to the classic redirect so the scan still gets recorded.
    function noReply(why) {
      try { console.log('Fast mode failed:', why); } catch (e) {}
      if (OFFLINE_MODE) {
        setOnline(false);
        queueScan(token);
        setTimeout(function () { busy = false; }, SHOW_RESULT_MS);
      } else {
        redirectMark(token);
      }
    }
  }

  function showResultObj(res) {
    res = res || {};
    if (res.success && res.alreadyChecked) {
      showAlreadyChecked(res.name, res.time);
      speak(WARN_ANNOUNCEMENT);
      feedback('warn');
    } else if (res.success) {
      showSuccess(res.name, res.regId);
      speak(SUCCESS_ANNOUNCEMENT);
      feedback('ok');
    } else {
      showResult('err', escapeHtml(res.message || 'Not recognized'));
      feedback('err');
    }
  }

  // Classic mode: full-page redirect to the backend, then "Scan Next" back.
  function redirectMark(token) {
    var returnUrl = window.location.origin + window.location.pathname;
    stopCameraSafely();
    var url = SCRIPT_EXEC_URL + '?action=mark&token=' + encodeURIComponent(token) +
      '&staff=' + encodeURIComponent(getStaff()) + '&key=' + encodeURIComponent(SCAN_KEY) +
      '&return=' + encodeURIComponent(returnUrl);
    leavingOnPurpose = true;
    window.location.href = url;
  }

  function startScanner() {
    document.getElementById('enableBox').style.display = 'none';
    try {
      html5Qrcode = new Html5Qrcode('reader');
      html5Qrcode.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        function onScanSuccess(decodedText) { goMark(decodedText); },
        function onScanFailure() { /* ignore per-frame no-match */ }
      ).catch(function () {
        showResult('err', 'Camera unavailable — tap below');
        document.getElementById('enableBox').style.display = 'block';
      });
    } catch (err) {
      showResult('err', 'Camera unavailable — tap below');
      document.getElementById('enableBox').style.display = 'block';
    }
  }

  function toggleManual() {
    var box = document.getElementById('manualBox');
    box.style.display = (box.style.display === 'block') ? 'none' : 'block';
  }

  function submitManual() {
    var val = document.getElementById('manualInput').value.trim();
    if (!val) return;
    lastCode = ''; // allow typing the same ID again on purpose
    goMark(val);
    document.getElementById('manualInput').value = '';
  }

  // Warn before leaving the page while scans are still waiting to send.
  var leavingOnPurpose = false;
  window.addEventListener('beforeunload', function (e) {
    if (leavingOnPurpose) return;
    if (OFFLINE_MODE && loadQueue().length) {
      e.preventDefault();
      e.returnValue = 'Some scans are not sent yet. Stay on this page.';
      return e.returnValue;
    }
  });
  window.addEventListener('online', function () { heartbeat(); });
  window.addEventListener('offline', function () { if (OFFLINE_MODE && FAST_EXEC_URL) setOnline(false); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) heartbeat(); });

  (function init() {
    renderStaffBar();
    if (VOICE_ON && FAST_EXEC_URL && /iP(hone|ad|od)|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document) {
      document.getElementById('soundBtn').style.display = 'block';
    }
    var params = new URLSearchParams(window.location.search);
    var r = params.get('r');
    // Personal link: ...qr-scanner/?staff=name@cru.org.sg saves the email for them.
    var linkStaff = params.get('staff');
    if (linkStaff && staffOk(linkStaff)) { setStaff(linkStaff); document.getElementById('staffBox').style.display = 'none'; renderStaffBar(); }

    if (r === 'ok') {
      showSuccess(params.get('name') || '');
      speak(SUCCESS_ANNOUNCEMENT);
    } else if (r === 'warn') {
      showAlreadyChecked(params.get('name') || '', params.get('time') || '');
      speak(WARN_ANNOUNCEMENT);
    } else if (r === 'err') {
      showResult('err', escapeHtml(params.get('msg') || 'Not recognized'));
    }
    if (r || linkStaff) history.replaceState(null, '', window.location.pathname);

    if (BEEP_ON) document.getElementById('beepBtn').style.display = 'block';
    renderNetBar();
    busy = true; // hold scans until we know which mode to use
    checkFastMode(function () {
      setTimeout(function () { busy = false; }, r ? 1800 : 0);
      syncQueue(); // send anything left over from before
    });
    if (OFFLINE_MODE && FAST_EXEC_URL) setInterval(function () { heartbeat(); if (online) syncQueue(); }, HEARTBEAT_MS);
    startScanner();
  })();
</script>
</body>
</html>
